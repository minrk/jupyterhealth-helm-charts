{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  {{- if .Values.postgres.serviceName }}
  name: {{ .Values.postgres.serviceName }}
  {{- else }}
  name: {{ include "jhe.fullname" . }}-postgres
  {{- end }}
  labels:
    {{- include "jhe.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- . | toYaml | nindent 4 }}
  {{- end }}
spec:
  selector:
    app.kubernetes.io/component: postgres
    {{- include "jhe.matchLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  type: ClusterIP
{{- end }}
